services:
  webhook-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN_NAME: webhook-server
    ports:
      - "3000:3000"
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN_NAME: worker
    env_file:
      - .env
    depends_on:
      - webhook-server
